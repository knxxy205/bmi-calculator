<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFit - Kalkulator BMI & Makro Nutrisi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 selection:bg-emerald-500/30">

    <div class="w-full max-w-2xl bg-cardBg/90 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-10 border border-white/5 relative overflow-hidden">
        
        
        <header class="text-center mb-8 relative z-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-100 pb-1">Analisis Kesehatan</h1>
            <p class="text-slate-400 text-sm mt-2">Pantau BMI, Kebutuhan Kalori (TDEE), & Makro Nutrisi Harian.</p>
            <p class="text-slate-500 text-xs mt-2 font-medium">Developed by <a href="https://portofolio-fadjri.vercel.app/" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-slate-100 hover:underline transition-colors">Fadjri Works</a></p>
        </header>

        <form id="bmiForm" class="space-y-4">
            <!-- Jenis Kelamin -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Jenis Kelamin</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                        <input type="radio" name="gender" value="male" checked class="text-emerald-500 focus:ring-emerald-500 mr-2"> Pria
                    </label>
                    <label class="flex items-center justify-center px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                        <input type="radio" name="gender" value="female" class="text-emerald-500 focus:ring-emerald-500 mr-2"> Wanita
                    </label>
                </div>
            </div>

            <!-- Berat & Tinggi -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Berat Badan (kg)</label>
                    <input type="number" id="weight" step="0.1" required placeholder="Contoh: 65" 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Tinggi Badan (cm)</label>
                    <input type="number" id="height" step="0.1" required placeholder="Contoh: 170" 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-slate-100">
                </div>
            </div>

            <!-- Usia & Aktivitas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Usia (tahun)</label>
                    <input type="number" id="age" required placeholder="Contoh: 25" 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Tingkat Aktivitas</label>
                    <select id="activity" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-slate-100">
                        <option value="1.2">Jarang / Tidak pernah berolahraga</option>
                        <option value="1.375">Ringan (Olahraga 1-3x seminggu)</option>
                        <option value="1.55" selected>Sedang (Olahraga 3-5x seminggu)</option>
                        <option value="1.725">Berat (Olahraga 6-7x seminggu)</option>
                        <option value="1.9">Sangat Berat (Atlet / Pekerja Fisik)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 font-semibold rounded-xl shadow-lg transition duration-200 text-slate-950">
                Hitung Sekarang
            </button>
        </form>

        <!-- Kotak Hasil -->
        <div id="resultBox" class="hidden mt-8 pt-8 border-t border-white/10 relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- BMI Card -->
                <div class="bg-white/5 border border-white/10 p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <p class="text-sm text-slate-400 font-medium mb-1">Skor BMI</p>
                        <div class="flex items-baseline gap-2">
                            <span id="bmiValue" class="text-4xl font-bold text-white">0</span>
                            <span id="bmiCategory" class="text-sm font-semibold px-2 py-1 rounded-lg"></span>
                        </div>
                    </div>
                    
                    <div class="mt-6 relative w-full h-3 bg-zinc-800 rounded-full overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-emerald-500 via-amber-500 to-rose-500 opacity-80"></div>
                        <div id="bmiIndicator" class="absolute top-0 bottom-0 w-1.5 bg-white shadow-[0_0_8px_white] transition-all duration-1000 ease-out" style="left: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 mt-2 font-medium uppercase tracking-wider">
                        <span>Kurus</span>
                        <span>Ideal</span>
                        <span>Over</span>
                        <span>Obese</span>
                    </div>
                </div>

                <!-- TDEE & Macros -->
                <div class="bg-white/5 border border-white/10 p-5 rounded-2xl">
                    <p class="text-sm text-slate-400 font-medium mb-1">Kebutuhan Kalori (TDEE)</p>
                    <div class="flex items-baseline gap-2 mb-4">
                        <span id="tdeeValue" class="text-4xl font-bold text-slate-100">0</span>
                        <span class="text-sm text-slate-500 font-medium">Kkal / Hari</span>
                    </div>

                    <div class="space-y-3">
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-2">Makro Nutrisi Harian</p>
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-rose-400"></div><span class="text-slate-300">Protein (30%)</span></div>
                            <span id="proteinVal" class="font-semibold text-white">0g</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-amber-400"></div><span class="text-slate-300">Karbo (40%)</span></div>
                            <span id="carbsVal" class="font-semibold text-white">0g</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-blue-400"></div><span class="text-slate-300">Lemak (30%)</span></div>
                            <span id="fatVal" class="font-semibold text-white">0g</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex gap-4 items-start">
                <div class="text-2xl">💡</div>
                <div>
                    <h4 class="text-sm font-semibold text-blue-400">Rekomendasi Ahli</h4>
                    <p id="weightAdvice" class="text-sm text-slate-300 mt-1 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        document.getElementById('bmiForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const gender = document.querySelector('input[name="gender"]:checked').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseInt(document.getElementById('age').value);
            const activity = parseFloat(document.getElementById('activity').value);

            if (!weight || !height || !age) return;

            // Hitung BMI
            const heightInMeters = height / 100;
            const bmi = weight / (heightInMeters * heightInMeters);
            
            // Kategori BMI
            let category = '';
            let colorClass = '';
            let advice = '';

            if (bmi < 18.5) {
                category = 'Kekurangan Berat Badan (Underweight)';
                colorClass = 'text-slate-100';
                advice = '💡 Saran: Tingkatkan asupan kalori bernutrisi dan latihan kekuatan.';
            } else if (bmi >= 18.5 && bmi < 24.9) {
                category = 'Berat Badan Normal (Ideal)';
                colorClass = 'text-blue-400';
                advice = '✨ Saran: Pertahankan pola makan sehat dan rutinitas olahraga.';
            } else if (bmi >= 25 && bmi < 29.9) {
                category = 'Kelebihan Berat Badan (Overweight)';
                colorClass = 'text-amber-400';
                advice = '⚠️ Saran: Kurangi makanan tinggi gula/lemak dan tingkatkan aktivitas fisik.';
            } else {
                category = 'Obesitas';
                colorClass = 'text-rose-400';
                advice = '🚨 Saran: Konsultasikan dengan ahli gizi untuk program penurunan berat badan yang aman.';
            }

            // Hitung BMR (Rumus Mifflin-St Jeor)
            let bmr;
            if (gender === 'male') {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            } else {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            }

            // Hitung TDEE (Total Daily Energy Expenditure)
            const tdee = Math.round(bmr * activity);

            // Tampilkan Hasil
            document.getElementById('bmiValue').textContent = bmi.toFixed(1);
            const catElem = document.getElementById('bmiCategory');
            catElem.textContent = category;
            catElem.className = `text-xs font-semibold mt-1 ${colorClass}`;

            document.getElementById('bmrValue').textContent = Math.round(bmr);
            document.getElementById('tdeeValue').textContent = tdee.toLocaleString('id-ID');
            document.getElementById('weightAdvice').innerHTML = advice;

            document.getElementById('resultBox').classList.remove('hidden');
        });
    </script>
</body>
</html>
